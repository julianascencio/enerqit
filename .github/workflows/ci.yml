name: Scientific checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest --cov=enerqit
  packaging-and-quantum-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,quantum]'
      - run: python -m pytest tests/test_qubo.py
      - run: python -m build
  agent-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' -r requirements/agent-study.txt
      - run: python -m pytest tests/test_storage.py tests/test_flexibility.py tests/test_network.py tests/test_contingency.py tests/test_storage_sizing.py tests/test_adequacy.py
      - run: python -m enerqit.storage_study --output results/battery-engineer.json
      - run: python -m enerqit.flexibility_study --output results/flexibility-engineer.json
      - run: python -m enerqit.network_study --output results/network-engineer.json
      - run: python -m enerqit.contingency_study
      - run: python -m enerqit.firming_study
      - run: python -m pytest tests/test_validation_lab.py
      - run: python -m enerqit.validation_study --agent --skip-scaling

      - run: python -m enerqit.adequacy_study
