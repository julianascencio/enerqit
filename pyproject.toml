[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enerqit"
version = "0.1.0"
description = "Quantum-inspired algorithms for energy systems, running on classical computers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.2,<4", "pvlib>=0.11,<0.17"]

[project.urls]
Repository = "https://github.com/julianascencio/enerqit"
Issues = "https://github.com/julianascencio/enerqit/issues"
Documentation = "https://github.com/julianascencio/enerqit/tree/main/docs"

[project.optional-dependencies]
examples = ["matplotlib>=3.8", "jupyterlab>=4"]
test = ["pytest>=8", "pytest-cov>=5"]
docs = ["sphinx>=7", "sphinx-gallery>=0.17", "numpydoc>=1.7", "matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "build>=1.2"]
quantum = ["dimod>=0.12", "qiskit>=1.2,<3"]

[project.scripts]
enerqit = "enerqit.cli:main"

[tool.setuptools.packages.find]
include = ["enerqit*"]

[tool.setuptools.package-data]
enerqit = ["data/*.json", "data/*.csv", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["enerqit"]
